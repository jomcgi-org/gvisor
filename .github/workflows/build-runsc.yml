name: build-runsc (spike)

"on":
  workflow_dispatch:
  push:
    branches:
      - spike/ci
      - fork/seed-slice1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
    - name: Free runner disk
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
        sudo docker image prune --all --force >/dev/null 2>&1 || true
        df -h /

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Build prerequisites
      run: |
        # images/default/Dockerfile lists these for running bazel directly.
        # The CC toolchain calls x86_64-linux-gnu-gcc with -fuse-ld=gold, so the runner
        # must ship ld.gold (ubuntu-24.04 does; the newer ubuntu-latest image does not).
        sudo apt-get update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
          build-essential crossbuild-essential-amd64 crossbuild-essential-arm64 clang pkg-config libffi-dev \
          libssl-dev patch zip unzip erofs-utils busybox-static

    - name: Bazelisk
      run: |
        if ! command -v bazelisk >/dev/null; then
          sudo curl -fsSL -o /usr/local/bin/bazelisk \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.26.0/bazelisk-linux-amd64
          sudo chmod +x /usr/local/bin/bazelisk
        fi
        echo "bazel version file: $(cat .bazelversion)"
        bazelisk version

    - name: Diagnose C toolchain
      continue-on-error: true
      run: |
        set +e
        x86_64-linux-gnu-gcc --version | head -1
        x86_64-linux-gnu-gcc -print-prog-name=ld
        ls -l /usr/bin/ld* /usr/bin/x86_64-linux-gnu-ld* /usr/lib/gold-ld 2>&1 | grep -v ldap
        echo 'int main(void){return 0;}' > /tmp/t.c
        x86_64-linux-gnu-gcc -static -fuse-ld=gold /tmp/t.c -o /tmp/t-gold; echo "gold rc=$?"
        x86_64-linux-gnu-gcc -static /tmp/t.c -o /tmp/t-default; echo "default rc=$?"
        dpkg -l | grep -E 'binutils|gcc-x86-64|crossbuild' | awk '{print $2, $3}'

    - name: Restore Bazel disk cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/bazel-disk-u2404
        key: bazel-disk-u2404-${{ github.sha }}
        restore-keys: bazel-disk-u2404-

    - name: Build
      run: |
        set -euxo pipefail
        # The disk cleanup removed the Android SDK that these variables still
        # name, and rules_android's repository rule fails on it.
        unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK_LATEST_HOME
        # //:release lays out runsc, containerd-shim-runsc-v1 and gvisor-bin/
        # (gvisor_sentry and the other sidecars) under bazel-bin/release/.
        # container_test holds runsc/container/template_fork_test.go.
        # template_fork_startup_benchmark_test holds the startup benchmark.
        # Test binaries are built, not run.
        bazelisk build \
          --jobs=6 \
          --keep_going \
          --verbose_failures \
          --disk_cache="$HOME/.cache/bazel-disk-u2404" \
          --show_progress_rate_limit=30 \
          //:release \
          //runsc \
          //runsc/cmd/sentry:gvisor_sentry \
          //runsc/container:container_test \
          //runsc/container:template_fork_startup_benchmark_test \
          //runsc/container:template_fork_e2e_test \
          //runsc/container:template_fork_semgrep_net_test \
          //runsc/forkd/main:forkd \
          //runsc/forkd:forkd_test \
          //runsc/forkd:forkd_integration_test \
          //test/cmd/forkbench \
          //test/cmd/fork_ready \
          //test/cmd/fork_state \
          //test/cmd/test_app

    - name: Run the forkd unit tests
      continue-on-error: true
      run: |
        # The unit tests use a fake runtime and need no KVM. The tests that need
        # root, cgroups or KVM skip here and run on the KVM host.
        unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK_LATEST_HOME
        bazelisk test --disk_cache="$HOME/.cache/bazel-disk-u2404" --test_output=errors //runsc/forkd:forkd_test

    - name: Save Bazel disk cache
      if: always()
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/bazel-disk-u2404
        key: bazel-disk-u2404-${{ github.sha }}

    - name: Stage artifacts
      run: |
        set -euxo pipefail
        BB=$(bazelisk info bazel-bin)
        mkdir -p out/release
        cp -rL "$BB/release/." out/release/
        # Test binaries with their runfiles (data deps incl. //:release), dereferenced.
        for t in container_test template_fork_startup_benchmark_test template_fork_e2e_test template_fork_semgrep_net_test; do
          tar --dereference -C "$BB/runsc/container" -czf "out/$t.runfiles.tar.gz" "${t}_" "$t.runfiles" 2>/dev/null \
            || tar --dereference -C "$BB/runsc/container" -czf "out/$t.runfiles.tar.gz" "${t}_" \
            || echo "no output for $t, skipping"
        done
        for t in forkd_test forkd_integration_test; do
          tar --dereference -C "$BB/runsc/forkd" -czf "out/$t.runfiles.tar.gz" "${t}_" "$t.runfiles" 2>/dev/null \
            || tar --dereference -C "$BB/runsc/forkd" -czf "out/$t.runfiles.tar.gz" "${t}_" \
            || echo "no output for $t, skipping"
        done
        tar -C out -czf out/runsc-release.tar.gz release
        for b in fork_ready fork_state test_app; do
          cp -L "$BB/test/cmd/$b/${b}_/$b" "out/$b" 2>/dev/null || cp -L "$BB/test/cmd/$b/$b" "out/$b"
        done
        cp -L "$BB/test/cmd/forkbench/forkbench_/forkbench" out/forkbench
        cd out
        ls -lh
        sha256sum runsc-release.tar.gz *.runfiles.tar.gz fork_ready fork_state test_app forkbench > sha256sums.txt
        (cd release && find . -type f -print0 | sort -z | xargs -0 sha256sum) > release-files.sha256
        cat sha256sums.txt release-files.sha256

    - name: Upload release binaries
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: runsc-release
        path: |
          out/runsc-release.tar.gz
          out/release-files.sha256
          out/sha256sums.txt
          out/fork_ready
          out/fork_state
          out/test_app
          out/forkbench

    - name: Upload test binaries
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: template-fork-tests
        path: out/*.runfiles.tar.gz
